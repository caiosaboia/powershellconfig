"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 2000

format = """
$hostname\
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$time\
$cmd_duration\
$shell\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bold red"
format = "[$symbol]($style) "

[shell]
fish_indicator = '󰈺'
powershell_indicator = 'pwsh'
unknown_indicator = 'mystery shell'
nu_indicator = 'nushell'
style = 'bold teal'
format = '[$indicator]($style) '
disabled = false

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "bold red"
style_root = "bold red"
format = '[$user]($style) '

[hostname]
ssh_only = true # Só mostra se estiver via SSH
format = '[via ](subtext0)[$ssh_symbol$hostname]($style) '
style = 'dimmed bold text'
trim_at = '.local'
disabled = false
ssh_symbol = '🌐 '
# hostname = ''

[directory]
style = "bold peach"
format = "[in ](subtext0)[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bold yellow"
format = '[on ](subtext0)[$symbol $branch]($style) '

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[bun]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[c]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[rust]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '
detect_files = ["Cargo.toml", "Cargo.lock", "rust-toolchain", "rust-toolchain.toml"]
detect_extensions = ["rs"]

[golang]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[php]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[java]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[kotlin]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[haskell]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)]($style) '

[python]
symbol = ""
style = "bold green"
format = '[via ](subtext0)[$symbol ($version)( \(#$virtualenv\))]($style) '

[docker_context]
symbol = ""
style = "bold sapphire"
format = '[with ](subtext0)[$symbol ($context)]($style) '

[conda]
symbol = ""
style = "bold sapphire"
format = '[with ](subtext0)[$symbol $environment]($style) '
ignore_base = false

[time]
disabled = true
time_format = "%R"
style = "bold lavender"
format = '[at ](subtext0)[ $time]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = "[took ](subtext0)[$duration]($style) "
style = "bold lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

